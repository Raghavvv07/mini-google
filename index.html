<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Google 1998</title>
<style>
  /* ── Reset & Base ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #f0f4ff;
    min-height: 100vh;
    padding: 20px;
  }

  /* ── Logo ── */
  .logo {
    text-align: center;
    margin: 30px 0 10px;
    font-size: 52px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1;
  }
  .logo span:nth-child(1) { color: #4285F4; }
  .logo span:nth-child(2) { color: #EA4335; }
  .logo span:nth-child(3) { color: #FBBC05; }
  .logo span:nth-child(4) { color: #4285F4; }
  .logo span:nth-child(5) { color: #34A853; }
  .logo span:nth-child(6) { color: #EA4335; }
  .logo-sub {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }

  /* ── Search bar ── */
  .search-area {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  #searchBox {
    width: 420px;
    padding: 12px 18px;
    font-size: 16px;
    border: 2px solid #ccc;
    border-radius: 24px;
    outline: none;
    transition: border-color 0.2s;
  }
  #searchBox:focus { border-color: #4285F4; }
  #searchBtn {
    padding: 12px 22px;
    font-size: 15px;
    background: #4285F4;
    color: #fff;
    border: none;
    border-radius: 24px;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.2s;
  }
  #searchBtn:hover { background: #1a6fe0; }

  /* ── Example buttons ── */
  .examples {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .eg-btn {
    padding: 6px 18px;
    border: 2px solid #4285F4;
    border-radius: 20px;
    background: #fff;
    color: #4285F4;
    cursor: pointer;
    font-size: 14px;
    font-weight: bold;
    transition: background 0.15s, color 0.15s;
  }
  .eg-btn:hover { background: #4285F4; color: #fff; }

  /* ── Surfer button ── */
  .surfer-area {
    text-align: center;
    margin-bottom: 18px;
    display: none;
  }
  #surferBtn {
    padding: 9px 22px;
    background: #34A853;
    color: #fff;
    border: none;
    border-radius: 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.2s;
  }
  #surferBtn:hover { background: #1e8a3e; }

  /* ── Two-column results layout ── */
  .results-wrapper {
    display: none;
    gap: 24px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .col {
    flex: 1;
    min-width: 0;
  }
  .col-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 14px;
    padding: 10px 16px;
    border-radius: 10px;
    text-align: center;
  }
  .col-title.old  { background: #FFF3CD; color: #856404; border: 2px solid #FBBC05; }
  .col-title.surf { background: #D4EDDA; color: #155724; border: 2px solid #34A853; }

  /* ── Result card ── */
  .card {
    background: #fff;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    border-left: 5px solid;
    transition: transform 0.15s;
  }
  .card:hover { transform: translateY(-2px); }
  .col.old-col  .card { border-color: #FBBC05; }
  .col.surf-col .card { border-color: #34A853; }

  .card-rank { font-size: 11px; color: #999; margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
  .card-url  { font-size: 15px; color: #1a0dab; font-weight: bold; margin-bottom: 8px; word-break: break-all; }
  .card-text { font-size: 14px; color: #444; line-height: 1.5; margin-bottom: 10px; }
  .card-score { font-size: 13px; font-weight: bold; color: #555; }
  .card-score span { color: #EA4335; }

  /* Search word highlight */
  mark {
    background: #FBBC05;
    border-radius: 3px;
    padding: 0 2px;
    color: #000;
    font-weight: bold;
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    font-size: 22px;
    color: #888;
    margin: 40px 0;
  }

  /* ── Spinner shown while surfer runs ── */
  #spinner {
    display: none;
    text-align: center;
    font-size: 16px;
    color: #4285F4;
    margin: 10px 0;
  }
</style>
</head>
<body>

<!-- ── LOGO ── -->
<div class="logo">
  <span>M</span><span>i</span><span>n</span><span>i</span>
  &nbsp;
  <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
</div>
<div class="logo-sub">&#9734; 1998 Edition &#9734; — The birth of PageRank</div>

<!-- ── SEARCH BAR ── -->
<div class="search-area">
  <input id="searchBox" type="text" placeholder="Search the web (1998 style)…" />
  <button id="searchBtn" onclick="doSearch()">Search!</button>
</div>

<!-- ── EXAMPLE BUTTONS ── -->
<div class="examples">
  <button class="eg-btn" onclick="quickSearch('pizza')">🍕 pizza</button>
  <button class="eg-btn" onclick="quickSearch('cricket')">🏏 cricket</button>
  <button class="eg-btn" onclick="quickSearch('movie')">🎬 movie</button>
  <button class="eg-btn" onclick="quickSearch('exam')">📝 exam</button>
</div>

<!-- ── RUN SURFER AGAIN BUTTON ── -->
<div class="surfer-area" id="surferArea">
  <button id="surferBtn" onclick="rerunSurfer()">🏄 Run the surfer again</button>
</div>

<!-- ── SPINNER ── -->
<div id="spinner">🏄 Surfing 100,000 pages… hold tight!</div>

<!-- ── RESULTS ── -->
<div class="results-wrapper" id="resultsWrapper">
  <div class="col old-col" id="colOld">
    <div class="col-title old">📜 Old way (1997)<br><small>keyword count wins</small></div>
    <div id="oldResults"></div>
  </div>
  <div class="col surf-col" id="colSurf">
    <div class="col-title surf">🏄 Surfer way (1998)<br><small>who gets the most visits?</small></div>
    <div id="surfResults"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  DATA — every page in our tiny web
// ─────────────────────────────────────────────
const PAGES = [
  { id:  1, url: "pune-food-guide.com",        text: "Where to eat in Pune - vada pav and biryani and pizza",                                          links: [2] },
  { id:  2, url: "best-pizza-pune.com",         text: "Fresh wood-fired pizza made daily - try our cheese pizza",                                       links: [1,3] },
  { id:  3, url: "college-canteen-blog.com",    text: "Student reviews of canteen food and chai and Friday pizza",                                      links: [2,4] },
  { id:  4, url: "pizza-recipes-home.com",      text: "Make pizza at home - pizza dough and pizza sauce",                                               links: [2,5] },
  { id:  5, url: "cheap-eats-pune.com",         text: "Good food under 100 rupees - misal and dosa and pizza slices",                                   links: [2] },
  { id:  6, url: "pizza-pizza-pizza.com",       text: "pizza pizza pizza pizza pizza pizza pizza pizza pizza pizza",                                     links: [1] },
  { id:  7, url: "cricket-live-scores.com",     text: "Live cricket scores and ball by ball cricket updates",                                           links: [8,10] },
  { id:  8, url: "ipl-fan-club.in",             text: "IPL fan chat - team news and cricket memes",                                                     links: [7,9] },
  { id:  9, url: "school-cricket-coach.com",    text: "Learn cricket batting and bowling with simple drills",                                           links: [7,10] },
  { id: 10, url: "cricket-history-india.com",   text: "Great moments from the history of Indian cricket",                                               links: [7] },
  { id: 11, url: "cricket-cricket-cricket.com", text: "cricket cricket cricket cricket cricket cricket cricket cricket cricket cricket",                  links: [7] },
  { id: 12, url: "bollywood-movie-reviews.in",  text: "Honest reviews of every new Bollywood movie released on Friday",                                 links: [13,15] },
  { id: 13, url: "movie-ticket-offers.com",     text: "Cheap movie tickets and weekend offers in Pune",                                                 links: [12,1] },
  { id: 14, url: "film-club-college.com",       text: "Our college film club watches one movie every week",                                             links: [12,17] },
  { id: 15, url: "classic-movie-songs.com",     text: "Old movie songs and the stories behind each movie",                                              links: [12,13,14] },
  { id: 16, url: "free-movie-free-movie.com",   text: "free movie free movie free movie free movie free movie movie movie movie movie movie",           links: [12] },
  { id: 17, url: "exam-tips-for-students.com",  text: "Smart exam tips - sleep well and practise old exam papers",                                      links: [18,3] },
  { id: 18, url: "college-notes-share.com",     text: "Share class notes with friends before the exam",                                                 links: [17,19] },
  { id: 19, url: "pune-college-news.in",        text: "News from Pune colleges - fest dates and exam timetables and cricket matches",                   links: [1,7,12,17] },
  { id: 20, url: "exam-exam-exam.com",          text: "exam exam exam exam exam exam exam exam exam exam",                                              links: [17] }
];

const N = PAGES.length; // 20 pages total

// Build an index: pageId → array index (0-based)
const idToIdx = {};
PAGES.forEach((p, i) => { idToIdx[p.id] = i; });

// Build "links in" count: how many pages point TO each page
const linksInCount = new Array(N).fill(0);
PAGES.forEach(p => {
  p.links.forEach(targetId => {
    if (idToIdx[targetId] !== undefined) linksInCount[idToIdx[targetId]]++;
  });
});

// ─────────────────────────────────────────────
//  SURFER SIMULATION
//  Returns an array of visit fractions (one per page, same order as PAGES)
// ─────────────────────────────────────────────
function runSurfer() {
  const MOVES     = 100_000; // total steps
  const BOREDOM   = 0.15;    // chance of jumping to a random page
  const visits    = new Array(N).fill(0);

  // Start on a random page (0-based index)
  let current = Math.floor(Math.random() * N);

  for (let step = 0; step < MOVES; step++) {
    visits[current]++;

    // Decide: bored jump OR follow a link?
    if (Math.random() < BOREDOM || PAGES[current].links.length === 0) {
      // Teleport to any page at random
      current = Math.floor(Math.random() * N);
    } else {
      // Pick one outgoing link at random and follow it
      const links = PAGES[current].links;
      const chosen = links[Math.floor(Math.random() * links.length)];
      current = idToIdx[chosen]; // convert page id to array index
    }
  }

  // Turn raw visit counts into percentages
  return visits.map(v => (v / MOVES) * 100);
}

// ─────────────────────────────────────────────
//  WORD COUNT — count whole-word occurrences
//  (case-insensitive)
// ─────────────────────────────────────────────
function countWord(text, word) {
  // \b = word boundary so "pizza" won't match "pizzamania"
  const re = new RegExp('\\b' + word + '\\b', 'gi');
  const m = text.match(re);
  return m ? m.length : 0;
}

// ─────────────────────────────────────────────
//  HIGHLIGHT — wrap every occurrence in <mark>
// ─────────────────────────────────────────────
function highlight(text, word) {
  const re = new RegExp('(\\b' + word + '\\b)', 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

// ─────────────────────────────────────────────
//  GLOBAL surfer scores — computed once on load,
//  refreshable with the "Run surfer again" button
// ─────────────────────────────────────────────
let surferScores = runSurfer();
let lastQuery    = '';

// ─────────────────────────────────────────────
//  SEARCH
// ─────────────────────────────────────────────
function doSearch() {
  const raw  = document.getElementById('searchBox').value.trim();
  if (!raw) return;
  const word = raw.toLowerCase();
  lastQuery  = word;

  // Filter pages that contain the search word
  const matching = PAGES.filter(p => countWord(p.text, word) > 0);

  if (matching.length === 0) {
    showEmpty();
    return;
  }

  // ── OLD WAY: sort by word count (highest first) ──
  const oldSorted = [...matching].sort((a, b) => {
    return countWord(b.text, word) - countWord(a.text, word);
  });

  // ── SURFER WAY: sort by surfer score (highest first) ──
  const surfSorted = [...matching].sort((a, b) => {
    return surferScores[idToIdx[b.id]] - surferScores[idToIdx[a.id]];
  });

  // Render both columns
  renderColumn('oldResults',  oldSorted,  word, 'old');
  renderColumn('surfResults', surfSorted, word, 'surf');

  // Show results area and surfer button
  const rw = document.getElementById('resultsWrapper');
  rw.style.display = 'flex';
  document.getElementById('surferArea').style.display = 'block';
}

// ─────────────────────────────────────────────
//  RENDER one column of results
// ─────────────────────────────────────────────
function renderColumn(containerId, pages, word, type) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';

  pages.forEach((p, rank) => {
    const idx   = idToIdx[p.id];
    const wc    = countWord(p.text, word);
    const score = surferScores[idx];
    const linksIn = linksInCount[idx];

    // Build score line differently for each column
    let scoreHtml;
    if (type === 'old') {
      scoreHtml = `Score: <span>${wc} occurrences of "${word}"</span>`;
    } else {
      scoreHtml = `Surfer score: <span>${score.toFixed(1)}%</span> &nbsp;|&nbsp; Links in: <span>${linksIn}</span>`;
    }

    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `
      <div class="card-rank">Rank #${rank + 1}</div>
      <div class="card-url">🔗 ${p.url}</div>
      <div class="card-text">${highlight(p.text, word)}</div>
      <div class="card-score">${scoreHtml}</div>
    `;
    container.appendChild(div);
  });
}

// ─────────────────────────────────────────────
//  EMPTY STATE
// ─────────────────────────────────────────────
function showEmpty() {
  const rw = document.getElementById('resultsWrapper');
  rw.style.display = 'flex';
  document.getElementById('surferArea').style.display = 'none';
  document.getElementById('oldResults').innerHTML  = `<div class="empty">🤷 Hmm, even the internet of 1998 never heard of that.<br><small>Try pizza, cricket, movie, or exam!</small></div>`;
  document.getElementById('surfResults').innerHTML = `<div class="empty">🏄 The surfer got lost looking for that.<br><small>Maybe it's 404 in 1998 too!</small></div>`;
}

// ─────────────────────────────────────────────
//  RERUN SURFER — redo simulation, refresh view
// ─────────────────────────────────────────────
function rerunSurfer() {
  const spinner = document.getElementById('spinner');
  spinner.style.display = 'block';

  // Small delay so the spinner is visible before the JS blocks
  setTimeout(() => {
    surferScores = runSurfer();
    spinner.style.display = 'none';
    if (lastQuery) doSearch(); // refresh results with new scores
  }, 50);
}

// ─────────────────────────────────────────────
//  QUICK SEARCH (example buttons)
// ─────────────────────────────────────────────
function quickSearch(word) {
  document.getElementById('searchBox').value = word;
  doSearch();
}

// ─────────────────────────────────────────────
//  Allow pressing Enter to search
// ─────────────────────────────────────────────
document.getElementById('searchBox').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doSearch();
});
</script>

</body>
</html>
